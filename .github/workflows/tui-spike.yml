name: TUI spike

# docs/rfc-tui.md §5: the OpenTUI prototype in poc/tui-spike, run under a real
# pseudo-terminal on every target @opentui/core ships a prebuilt for, through
# every install path. Throwaway: delete with poc/tui-spike once P1c starts.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "poc/tui-spike/**"
      - ".github/workflows/tui-spike.yml"

defaults:
  run:
    working-directory: poc/tui-spike

jobs:
  glibc-macos-windows:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, os: macos-15 }
          - { target: darwin-x64, os: macos-15-intel }
          - { target: linux-x64, os: ubuntu-24.04 }
          - { target: linux-arm64, os: ubuntu-24.04-arm }
          - { target: win32-x64, os: windows-2025 }
          - { target: win32-arm64, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc -p .

      # The TUI can only show a native load error inside its pseudo-terminal;
      # this prints the whole thing to the log.
      - name: Native core
        if: ${{ !cancelled() }}
        run: bun harness/probe.ts

      - name: From source
        if: ${{ !cancelled() }}
        run: bun harness/run.ts --out results-source.json

      - name: Compiled binary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          bun build --compile src/main.tsx --outfile dist/tui-spike
          bin=dist/tui-spike; [ "$RUNNER_OS" = Windows ] && bin=dist/tui-spike.exe
          bun harness/run.ts --bin "$bin" --out results-compiled.json

      - name: Installed with npm
        if: ${{ !cancelled() }}
        run: bun harness/installed.ts npm --out results-npm.json

      - name: Installed with bun
        if: ${{ !cancelled() }}
        run: bun harness/installed.ts bun --out results-bun.json

      - name: Summary
        if: ${{ !cancelled() }}
        run: bun harness/summary.ts ${{ matrix.target }} >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: tui-spike-${{ matrix.target }}
          path: poc/tui-spike/results-*.json

  # musl: run inside Alpine with Docker rather than `container:`, because the
  # runner cannot execute JavaScript actions inside an arm64 Alpine container.
  musl:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64-musl, os: ubuntu-24.04 }
          - { target: linux-arm64-musl, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # OpenTUI does not detect musl: without OPENTUI_LIBC=musl it loads the
      # glibc build. The first probe records what happens then; everything
      # after it runs with the variable set.
      - name: Harness in Alpine
        run: |
          docker run --rm -v "$PWD:/w" -w /w oven/bun:1.3.14-alpine sh -euc '
            bun install --frozen-lockfile
            bun harness/probe.ts || echo "(expected without OPENTUI_LIBC)"
            export OPENTUI_LIBC=musl
            bun harness/probe.ts
            status=0
            bun harness/run.ts --out results-source.json || status=1
            bun build --compile src/main.tsx --outfile dist/tui-spike
            bun harness/run.ts --bin dist/tui-spike --out results-compiled.json || status=1
            bun harness/installed.ts bun --out results-bun.json || status=1
            bun harness/summary.ts ${{ matrix.target }} > summary.md
            exit $status
          '

      - name: Summary
        if: ${{ !cancelled() }}
        run: cat summary.md >> "$GITHUB_STEP_SUMMARY" || echo "no summary (the job stopped early)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: tui-spike-${{ matrix.target }}
          path: poc/tui-spike/results-*.json
