name: CI

# Green from commit #1: typecheck must not drift because nothing enforces it.
# This job is the enforcement. The `june build` of the site and the dev/built
# parity check join here as they land.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  # The npm user's first session, against the tarballs this tree would
  # publish — catches what only exists outside the monorepo (phantom deps,
  # broken bins, template wiring). scripts/smoke-packed.sh.
  packed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: bun install --frozen-lockfile

      - name: Packed E2E
        run: bash scripts/smoke-packed.sh

  # The Node host stays a TESTED claim, not a code comment: the same
  # startDevServer, served by node:http (no global Bun), over real HTTP.
  node-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: bun install --frozen-lockfile

      - name: Node host smoke
        # --conditions=source resolves @junejs/* to their src/*.ts entries (which
        # tsx compiles) instead of the dual-export `default` → dist/*.js, which is
        # unbuilt in this from-source run. Without it, @junejs/core/cache → the
        # missing dist/cache.js and the smoke dies before it starts.
        run: node --conditions=source --import tsx scripts/smoke-node.ts

  # The BUILT worker on workerd, the runtime production runs. The dev host has no
  # ASSETS binding and isn't workerd, so deploy-only bugs pass every Bun test — POST
  # /mcp answered -32700 on every deployed app with assets for three months (#198).
  # `june build` examples/basic, `wrangler dev --local` it, exercise it over HTTP.
  workerd:
    runs-on: ubuntu-latest
    # The smoke bounds every request itself; this is the backstop against an
    # unforeseen hang (the default is 6 hours). It runs in ~15s.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Built worker on workerd
        run: bun scripts/smoke-workerd.ts

  # @junejs/pdf-typst-wasm's engine is Rust built for wasm32. The jobs above never build it,
  # so its Bun tests skip there; here the crate's own tests run, the module is built the way
  # publish.yml builds it (the toolchain rust-toolchain.toml pins, binaryen's wasm-opt pinned
  # by scripts/install-binaryen.sh), the JS tests run against it, and the workerd smoke serves
  # the published shape. A cold build is about a minute; the cargo cache keeps it shorter.
  pdf-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/pdf-typst-wasm
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/pdf-typst-wasm

      - name: binaryen (wasm-opt)
        run: bash ../../scripts/install-binaryen.sh

      - name: Install
        run: bun install --frozen-lockfile

      - name: Engine tests (cargo)
        run: cargo test --release --locked

      - name: Build the module and the package
        run: bun run build

      - name: Renderer tests
        run: bun test

      - name: On workerd
        run: SMOKE_SKIP_BUILD=1 bun scripts/smoke-workerd.ts

      - name: In a bun build --compile binary
        run: bun scripts/smoke-compile.ts

      # @junejs/pdf-font-noto-sans-tc needs the engine built above and its font files, which
      # are fetched (pinned, checksummed), never committed.
      - name: Noto Sans TC — fonts, tests
        working-directory: packages/pdf-font-noto-sans-tc
        run: bun run fetch-fonts && bun test

      - name: Noto Sans TC — on workerd, in a compiled binary
        working-directory: packages/pdf-font-noto-sans-tc
        run: bun scripts/smoke-workerd.ts && bun scripts/smoke-compile.ts

  # The toolchain flake.nix pins, in the form agents get it: the dev image, built and
  # loaded on both Linux systems the flake supports, runs every check above from a fresh copy
  # of the tree as its unprivileged user (scripts/smoke-dev-image.sh). `nix flake check`
  # also builds the devShell and fails when nix/bun.json falls out of step with
  # package.json's packageManager.
  nix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Flake check
        run: nix flake check

      - name: Dev image
        run: bash scripts/smoke-dev-image.sh
