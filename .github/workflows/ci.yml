name: CI

# Green from commit #1: typecheck must not drift because nothing enforces it.
# This job is the enforcement. The `june build` of the site and the dev/built
# parity check join here as they land.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  # The npm user's first session, against the tarballs this tree would
  # publish — catches what only exists outside the monorepo (phantom deps,
  # broken bins, template wiring). scripts/smoke-packed.sh.
  packed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: bun install --frozen-lockfile

      - name: Packed E2E
        run: bash scripts/smoke-packed.sh

  # The Node host stays a TESTED claim, not a code comment: the same
  # startDevServer, served by node:http (no global Bun), over real HTTP.
  node-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: bun install --frozen-lockfile

      - name: Node host smoke
        # --conditions=source resolves @junejs/* to their src/*.ts entries (which
        # tsx compiles) instead of the dual-export `default` → dist/*.js, which is
        # unbuilt in this from-source run. Without it, @junejs/core/cache → the
        # missing dist/cache.js and the smoke dies before it starts.
        run: node --conditions=source --import tsx scripts/smoke-node.ts

  # The BUILT worker on workerd, the runtime production runs. The dev host has no
  # ASSETS binding and isn't workerd, so deploy-only bugs pass every Bun test — POST
  # /mcp answered -32700 on every deployed app with assets for three months (#198).
  # `june build` examples/basic, `wrangler dev --local` it, exercise it over HTTP.
  workerd:
    runs-on: ubuntu-latest
    # The smoke bounds every request itself; this is the backstop against an
    # unforeseen hang (the default is 6 hours). It runs in ~15s.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Built worker on workerd
        run: bun scripts/smoke-workerd.ts
